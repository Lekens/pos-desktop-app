# electron-builder configuration — Windows + macOS
# Documentation: https://www.electron.build/configuration/configuration

appId: ng.poschoice.desktop
productName: POSChoice
copyright: "Copyright © 2026"

# Build output directory
directories:
  output: release
  buildResources: resources

# Files to include in the packaged Electron app
# NOTE: .env is intentionally excluded — secrets must never be bundled into the installer.
# All runtime configuration is stored in electron-store after first launch.
files:
  - dist-electron/**/*
  - "!dist-electron/**/*.map"
  - node_modules/**/*
  - package.json

# Copy the built React frontend into app resources
extraResources:
  - from: ../POS-frontend-v2/dist
    to: frontend-dist
    filter:
      - "**/*"
      - "!**/*.map"

# ── Windows ────────────────────────────────────────────────────────────────────
win:
  target:
    - target: nsis          # Standard installer (.exe)
      arch: [x64, ia32]    # 64-bit + 32-bit (older PCs common in Nigeria)
    - target: portable      # Single-file .exe, no installation required
      arch: [x64]

  icon: resources/icon.ico

  # Do not require admin rights to install
  requestedExecutionLevel: asInvoker

  # Code signing — required before public distribution (BUG-002).
  # Without signing, Windows SmartScreen blocks the installer for all users.
  # Set these environment variables in your CI pipeline (GitHub Actions, etc.):
  #   CERTIFICATE_BASE64   — base64-encoded .pfx certificate
  #   CERTIFICATE_PASSWORD — certificate passphrase
  # Then uncomment the block below:
  # signAndEditExecutable: true
  # certificateFile: resources/certificate.pfx
  # certificatePassword: ${env.CERTIFICATE_PASSWORD}
  # rfc3161TimeStampServer: http://timestamp.sectigo.com

nsis:
  oneClick: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "POSChoice"
  menuCategory: "POS v2"
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  artifactName: "POS-Setup-${version}.exe"
  deleteAppDataOnUninstall: false

# ── macOS ──────────────────────────────────────────────────────────────────────
mac:
  target:
    - target: dmg           # Disk image — standard macOS distribution method
      arch: [x64, arm64]   # Intel + Apple Silicon (M1/M2/M3/M4)
    - target: zip           # Zipped .app for manual distribution
      arch: [x64, arm64]

  icon: resources/icon.icns   # macOS requires .icns format (multi-size)

  category: public.app-category.business

  # Hardened runtime is required for Apple notarization.
  # Without notarization, Gatekeeper shows a warning on first open.
  hardenedRuntime: true
  gatekeeperAssess: false

  # Entitlements grant permissions required by the hardened runtime
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist

  # Code signing — required before public distribution (BUG-002).
  # Without signing, macOS Gatekeeper blocks the app with "unidentified developer".
  # Set these environment variables in your CI pipeline:
  #   APPLE_ID              — your Apple Developer account email
  #   APPLE_APP_SPECIFIC_PASSWORD — app-specific password from appleid.apple.com
  #   APPLE_TEAM_ID         — 10-character team ID from developer.apple.com
  # Then uncomment the block below:
  # identity: "Developer ID Application: Your Name (APPLE_TEAM_ID)"

  # Notarization (requires code signing + Apple account credentials)
  # notarize:
  #   teamId: ${env.APPLE_TEAM_ID}

dmg:
  artifactName: "POS-${version}.dmg"
  title: "POS v2 ${version}"
  icon: resources/icon.icns
  iconSize: 100
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
  window:
    width: 540
    height: 380

# ── Auto-update publish ────────────────────────────────────────────────────────
# Option A: GitHub Releases (recommended — free)
# Supports both Windows (.exe + .yml) and macOS (.dmg + .yml) releases
publish:
  provider: github
  owner: YOUR_GITHUB_ORG        # TODO: replace with actual GitHub org/username before enabling auto-update
  repo: pos-v2-releases          # TODO: replace with actual repository name
  private: false
  releaseType: release

# Option B: Self-hosted (uncomment to use instead)
# publish:
#   provider: generic
#   url: https://updates.yourstore.com
#   useMultipleRangeRequest: false
